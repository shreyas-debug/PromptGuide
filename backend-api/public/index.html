<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptGuide — AI Prompt Refinement</title>
    <meta name="description" content="Evaluate and refine your AI prompts using an intelligent agentic loop.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <div class="ambient-glow"></div>

    <!-- HEADER -->
    <header class="header fade-in">
        <div class="logo">
            <svg class="logo-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <polygon
                    points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
            </svg>
            <span class="logo-text">PromptGuide</span>
        </div>
        <p class="tagline">Evaluate &amp; refine your prompts with an <em>agentic AI loop</em></p>
    </header>

    <!-- APP -->
    <main class="app fade-in delay-1">

        <!-- TOP: Prompt Input -->
        <section class="card input-card">
            <label class="section-label" for="promptInput">Your Prompt</label>
            <textarea id="promptInput" rows="4" placeholder="Paste or type your prompt here…"
                spellcheck="false"></textarea>
            <div class="btn-row">
                <button id="evaluateBtn" class="btn btn-primary">Evaluate</button>
                <button id="autoRefineBtn" class="btn btn-accent" disabled>⚡ Auto-Refine</button>
                <button id="stopBtn" class="btn btn-stop hidden">■ Stop</button>
            </div>
        </section>

        <!-- BOTTOM TWO COLUMNS (appear after evaluate) -->
        <div class="columns" id="columnsArea">
            <!-- LEFT: Score -->
            <section id="scorePanel" class="card score-card hidden">
                <div class="score-ring-wrap">
                    <svg class="score-ring" viewBox="0 0 120 120">
                        <circle class="score-ring-bg" cx="60" cy="60" r="52" />
                        <circle id="scoreCircle" class="score-ring-progress" cx="60" cy="60" r="52" />
                    </svg>
                    <div class="score-value">
                        <span id="scoreNumber">0</span>
                        <span class="score-unit">/ 100</span>
                    </div>
                </div>
                <p id="scoreFeedback" class="score-feedback"></p>
                <div id="scoreBreakdown" class="score-breakdown"></div>
            </section>

            <!-- RIGHT: Refine Controls + Result -->
            <div class="right-col" id="rightCol">
                <!-- Refine Controls -->
                <div id="refineControls" class="card refine-card hidden">
                    <label class="section-label">Refine Settings</label>
                    <div class="ctrl-row">
                        <div class="ctrl-group">
                            <label for="gauntletSelect" class="ctrl-label">Strategy</label>
                            <select id="gauntletSelect" class="select"></select>
                        </div>
                        <div class="ctrl-group">
                            <label for="targetScore" class="ctrl-label">Target: <span
                                    id="targetScoreValue">80</span></label>
                            <input id="targetScore" type="range" min="60" max="100" value="80" class="range-slider">
                        </div>
                    </div>
                    <button id="singleRefineBtn" class="btn btn-secondary full-w">Refine Once</button>
                </div>

                <!-- Result -->
                <div id="finalResult" class="card result-card hidden">
                    <div class="result-badge">✅ Refined Prompt</div>
                    <textarea id="refinedPrompt" rows="4" readonly></textarea>
                    <div class="result-actions">
                        <button id="copyBtn" class="btn btn-ghost">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                            </svg>
                            <span id="copyLabel">Copy</span>
                        </button>
                    </div>
                </div>

                <!-- Reasoning -->
                <div id="reasoningToggle" class="reasoning-toggle hidden">
                    <button id="toggleReasoningBtn" class="btn-reasoning-toggle">
                        <span class="toggle-icon">▶</span> <span>View AI reasoning</span>
                    </button>
                </div>
                <div id="stepsContainer" class="steps-container"></div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer fade-in delay-2">
        <p>Built by <strong>Shreyas</strong> · MSc Project 2025 ·
            <a href="https://github.com/shreyas-debug/PromptGuide" target="_blank" rel="noopener">GitHub ↗</a>
        </p>
    </footer>

    <script src="/app.js"></script>
</body>

</html>
